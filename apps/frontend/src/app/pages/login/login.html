<div class="login-container">
  <div class="login-card">

    <div class="logo">
      <h1>Finora</h1>
      <p>Controla tus gastos de forma sencilla</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <div class="register-text">
      <span>¿No tienes una cuenta?</span>
      <button type="button" (click)="goToRegister()">
  Registrarse
</button>
    </div>

  </div>
</div>
